<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>TimeBack · Guide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>TimeBack</h1>
    <nav id="nav"></nav>
  </header>

  <main class="wide-main">
    <section class="panel">
      <div class="roster-head">
        <h2>Roster</h2>
        <span class="muted small" id="updated">Loading…</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Grade</th>
              <th>Mastered</th>
              <th>Working on</th>
              <th>Session</th>
              <th>Time</th>
              <th>Idle</th>
              <th>Flag</th>
            </tr>
          </thead>
          <tbody id="roster"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="guide.js"></script>
</body>
</html>

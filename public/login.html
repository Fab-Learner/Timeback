<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>TimeBack · Sign in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>TimeBack</h1>
  </header>

  <main class="narrow">
    <section class="panel">
      <form id="emailForm" class="stack">
        <h2>Sign in</h2>
        <p class="muted">Admins and guides: enter your email and we'll send you a 6-digit code.</p>
        <label class="field">
          Email
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <button class="primary wide" type="submit">Send code</button>
      </form>

      <form id="codeForm" class="stack" hidden>
        <h2>Check your email</h2>
        <p class="muted" id="sentTo"></p>
        <label class="field">
          6-digit code
          <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required>
        </label>
        <button class="primary wide" type="submit">Sign in</button>
        <button class="link" type="button" id="back">Use a different email</button>
      </form>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
